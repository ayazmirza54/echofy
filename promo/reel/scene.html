<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clone Mode EP01</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; margin: 0 auto; height: 100vh; aspect-ratio: 9 / 16; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timeline.js"></script>
<script src="vo_timing.js"></script>
<script>
// Every frame is a pure function of t (seconds): renderFrame(t) draws it.
// Open this file in a browser to preview (?t=12 freezes on a frame,
// ?captions=0 hides the burned-in captions).
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1080, H = 1920, CX = W / 2, CY = H / 2;
const params = new URLSearchParams(location.search);
const SHOW_CAPTIONS = params.get('captions') !== '0';
const BEAT = 60 / TL.bpm;

const C = {
  fg: '#F4F4F6', dim: '#7A7A86', faint: '#2A2A33', panel: '#0B0B10', line: '#1D1D26',
  acc: '#C6FF3D', acc2: '#8B5CFF', red: '#FF3B5C', cyan: '#3DE8FF', amber: '#FFB547', green: '#3DDC84',
};
const SANS = '"Inter Display", "Inter", sans-serif';
const MONO = '"JetBrains Mono", "DejaVu Sans Mono", monospace';

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, k) => a + (b - a) * k;
const p = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); };
// visible between a and b with fade-in fi and fade-out fo
const win = (t, a, b, fi = .2, fo = .2) => Math.min(p(t, a, a + fi), 1 - p(t, b - fo, b));
const frameSeed = t => Math.floor(t * 30);

function kickEnv(t) {
  for (const [a, b] of TL.kickSections) if (t >= a && t < b) return Math.exp(-((t - a) % BEAT) * 9);
  return 0;
}
function impactEnv(t) {
  let v = 0;
  for (const [it, s] of TL.impacts) if (t >= it) v = Math.max(v, s * Math.exp(-(t - it) * 6));
  return v;
}
function glitchAmt(t) {
  let v = 0;
  for (const tt of TL.transitions) { const d = Math.abs(t - tt); if (d < .12) v = Math.max(v, 1 - d / .12); }
  return v;
}

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function setFont(size, weight = 800, fam = SANS, ls = 0) {
  ctx.font = `${weight} ${size}px ${fam}`; ctx.letterSpacing = ls + 'px';
}
function tw(s, size, weight = 800, fam = SANS, ls = 0) {
  ctx.save(); setFont(size, weight, fam, ls); const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function txt(s, x, y, o = {}) {
  let { size = 60, weight = 800, fam = SANS, color = C.fg, align = 'center', base = 'middle',
        alpha = 1, ls = 0, glow = 0, glowColor = null, maxW = 0, stroke = 0 } = o;
  if (maxW) { const w = tw(s, size, weight, fam, ls); if (w > maxW) size *= maxW / w; }
  ctx.save();
  ctx.globalAlpha *= alpha;
  setFont(size, weight, fam, ls);
  ctx.textAlign = align; ctx.textBaseline = base;
  if (glow) { ctx.shadowColor = glowColor || color; ctx.shadowBlur = glow; }
  if (stroke) { ctx.lineWidth = stroke; ctx.strokeStyle = color; ctx.strokeText(s, x, y); }
  else { ctx.fillStyle = color; ctx.fillText(s, x, y); }
  ctx.restore();
}
// Kinetic slam: scales down from big, shakes, RGB-splits on impact.
function slam(s, x, y, t, t0, o = {}) {
  const d = t - t0; if (d < 0) return;
  const k = eOutExpo(clamp(d / .22));
  const sc = lerp(o.from || 2.4, 1, k);
  const shake = Math.exp(-d * 10) * (o.shake ?? 20);
  const sx = (hash(frameSeed(t)) - .5) * shake, sy = (hash(frameSeed(t) + 9) - .5) * shake;
  ctx.save();
  ctx.translate(x + sx, y + sy); ctx.scale(sc, sc);
  ctx.globalAlpha *= clamp(d / .06) * (o.alpha ?? 1);
  const split = Math.exp(-d * 7) * 14;
  if (split > .6) {
    ctx.globalCompositeOperation = 'lighter';
    txt(s, -split, 0, { ...o, color: '#ff1f4f', alpha: .85, glow: 0 });
    txt(s, split, 0, { ...o, color: '#1fe3ff', alpha: .85, glow: 0 });
    ctx.globalCompositeOperation = 'source-over';
  }
  txt(s, 0, 0, { ...o, alpha: 1 });
  ctx.restore();
}
function glow(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}
function bgDots(t, a = 1) {
  ctx.save(); ctx.fillStyle = `rgba(255,255,255,${.07 * a})`;
  const s = 54, oy = (t * 14) % s;
  for (let y = -s; y < H + s; y += s) for (let x = 27; x < W; x += s) ctx.fillRect(x - 1.5, y + oy - 1.5, 3, 3);
  ctx.restore();
}
function particles(t, a = 1, color = C.acc) {
  ctx.save(); ctx.fillStyle = color;
  for (let i = 0; i < 50; i++) {
    const sp = 30 + hash(i * 3) * 80;
    const x = hash(i) * W + Math.sin(t * .7 + i) * 20;
    const y = (hash(i * 7) * H - t * sp) % H; const yy = y < 0 ? y + H : y;
    ctx.globalAlpha = a * (.15 + .5 * hash(i * 11)) * (.6 + .4 * Math.sin(t * 3 + i));
    const r = 1 + hash(i * 5) * 2.5;
    ctx.fillRect(x, yy, r, r);
  }
  ctx.restore();
}
function chip(s, x, y, o = {}) {
  const { size = 26, bg = C.acc, color = '#000', align = 'center', alpha = 1, pad = 20, border = null } = o;
  const w = tw(s, size, 800, MONO, 2) + pad * 2, h = size * 1.9;
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  ctx.save(); ctx.globalAlpha *= alpha;
  rr(x0, y - h / 2, w, h, h / 2);
  if (bg) { ctx.fillStyle = bg; ctx.fill(); }
  if (border) { ctx.strokeStyle = border; ctx.lineWidth = 2.5; ctx.stroke(); }
  txt(s, x0 + w / 2, y + 1, { size, weight: 800, fam: MONO, color, ls: 2 });
  ctx.restore();
  return w;
}
function windowFrame(x, y, w, h, title, o = {}) {
  ctx.save();
  ctx.shadowColor = o.shadow || 'rgba(0,0,0,.9)'; ctx.shadowBlur = 70;
  rr(x, y, w, h, 26); ctx.fillStyle = o.bg || '#0A0A0E'; ctx.fill();
  ctx.restore();
  rr(x, y, w, h, 26); ctx.strokeStyle = o.border || '#262630'; ctx.lineWidth = 2.5; ctx.stroke();
  [C.red, C.amber, C.green].forEach((c, i) => { ctx.beginPath(); ctx.arc(x + 40 + i * 32, y + 38, 9, 0, 7); ctx.fillStyle = c; ctx.fill(); });
  if (title) txt(title, x + w / 2, y + 39, { size: 24, weight: 500, fam: MONO, color: C.dim });
  ctx.fillStyle = '#1A1A22'; ctx.fillRect(x, y + 76, w, 2);
}
function caret(x, y, h, t, color = C.acc) {
  if (Math.floor(t * 3.2) % 2 === 0) { ctx.fillStyle = color; ctx.fillRect(x + 4, y - h / 2, 4, h); }
}
// wrap words into lines; returns [{w, x, line}] relative to a left edge
function layoutWords(words, size, weight, fam, maxW, ls = 0) {
  ctx.save(); setFont(size, weight, fam, ls);
  const space = ctx.measureText(' ').width; const out = []; let x = 0, line = 0;
  for (const w of words) {
    const ww = ctx.measureText(w).width;
    if (x > 0 && x + ww > maxW) { x = 0; line++; }
    out.push({ w, x, line, ww }); x += ww + space;
  }
  ctx.restore();
  return out;
}

// ---------- mock app UIs (generic, drawn in a 600x400 box) ----------
function mockBase(bg = '#101016') { rr(0, 0, 600, 400, 22); ctx.fillStyle = bg; ctx.fill(); ctx.strokeStyle = '#2a2a35'; ctx.lineWidth = 2; ctx.stroke(); }
function bars(x, y, w, h, c = '#2a2a35') { rr(x, y, w, h, h / 2); ctx.fillStyle = c; ctx.fill(); }
function mockVoice(t) {
  mockBase();
  for (let i = 0; i < 5; i++) bars(50, 50 + i * 34, [470, 420, 500, 300, 380][i], 14);
  rr(110, 260, 380, 84, 42); ctx.fillStyle = '#000'; ctx.fill(); ctx.strokeStyle = C.acc; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.arc(160, 302, 22, 0, 7); ctx.fillStyle = C.acc; ctx.fill();
  for (let i = 0; i < 22; i++) {
    const h = 8 + 40 * noise(i * .6 + t * 8) * Math.sin((i / 21) * Math.PI);
    ctx.fillStyle = C.acc; ctx.fillRect(205 + i * 12, 302 - h / 2, 6, h);
  }
}
function mockLauncher(t) {
  mockBase('#14141b');
  rr(30, 26, 540, 64, 16); ctx.fillStyle = '#1d1d26'; ctx.fill();
  ctx.beginPath(); ctx.arc(66, 58, 12, 0, 7); ctx.strokeStyle = C.dim; ctx.lineWidth = 3; ctx.stroke();
  txt('Search for apps and commands…', 96, 59, { size: 22, weight: 500, align: 'left', color: C.dim });
  const rows = ['Clipboard History', 'Window Management', 'Calculator', 'Snippets', 'AI Chat'];
  const cols = [C.red, C.cyan, C.amber, C.acc2, C.acc];
  const sel = Math.floor(t * 4) % 5;
  rows.forEach((r, i) => {
    const y = 116 + i * 54;
    if (i === sel) { rr(24, y - 4, 552, 50, 12); ctx.fillStyle = '#262632'; ctx.fill(); }
    rr(44, y + 6, 30, 30, 8); ctx.fillStyle = cols[i]; ctx.fill();
    txt(r, 92, y + 22, { size: 22, weight: 600, align: 'left' });
    txt('⏎', 556, y + 22, { size: 20, weight: 500, align: 'right', color: C.dim });
  });
}
function mockWorkspace(t) {
  mockBase('#f6f5f2');
  ctx.fillStyle = '#ebe9e4'; ctx.fillRect(0, 0, 150, 400);
  rr(0, 0, 600, 400, 22); ctx.strokeStyle = '#2a2a35'; ctx.lineWidth = 2; ctx.stroke();
  for (let i = 0; i < 7; i++) bars(20, 34 + i * 40, [90, 70, 100, 60, 84, 72, 96][i], 12, '#cfccc4');
  txt('Product Roadmap', 180, 60, { size: 34, weight: 800, align: 'left', color: '#1b1b1f' });
  for (let i = 0; i < 4; i++) {
    const y = 110 + i * 46;
    rr(180, y, 22, 22, 5); ctx.strokeStyle = '#8a877f'; ctx.lineWidth = 2; ctx.stroke();
    if (i < 2) { ctx.fillStyle = '#2f80ed'; ctx.fill(); }
    bars(218, y + 5, [260, 200, 300, 230][i], 12, '#d6d3cc');
  }
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    ctx.strokeStyle = '#d6d3cc'; ctx.strokeRect(180 + c * 130, 300 + r * 30, 130, 30);
  }
}
function mockChat(t) {
  mockBase();
  const msgs = [[0, 300], [1, 360], [0, 220], [1, 280]];
  msgs.forEach(([me, w], i) => {
    const y = 40 + i * 84, x = me ? 560 - w : 40;
    rr(x, y, w, 60, 22); ctx.fillStyle = me ? C.acc2 : '#22222c'; ctx.fill();
    bars(x + 20, y + 24, w - 60, 12, me ? 'rgba(255,255,255,.5)' : '#3a3a48');
  });
}
function mockMusic(t) {
  mockBase('#0e0e14');
  const g = ctx.createLinearGradient(40, 40, 260, 260);
  g.addColorStop(0, C.red); g.addColorStop(1, C.acc2);
  rr(40, 40, 220, 220, 18); ctx.fillStyle = g; ctx.fill();
  bars(290, 70, 240, 20, '#e8e8ee'); bars(290, 110, 160, 14, '#4a4a58');
  bars(40, 300, 520, 8, '#2a2a35'); bars(40, 300, 520 * ((t * .3) % 1), 8, C.fg);
  ctx.beginPath(); ctx.arc(300, 355, 24, 0, 7); ctx.fillStyle = C.fg; ctx.fill();
}
function mockMail(t) {
  mockBase();
  for (let i = 0; i < 6; i++) {
    const y = 30 + i * 60;
    ctx.beginPath(); ctx.arc(60, y + 22, 18, 0, 7); ctx.fillStyle = [C.cyan, C.amber, C.acc2, C.red, C.acc, C.green][i]; ctx.fill();
    bars(96, y + 8, 140, 13, '#d8d8e0'); bars(96, y + 30, 400 - (i % 3) * 60, 11, '#33333f');
  }
}
const MOCKS = [mockVoice, mockLauncher, mockWorkspace, mockChat, mockMusic, mockMail];
function drawMock(m, x, y, w, h, t, blur = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(w / 600, h / 400);
  if (blur) ctx.filter = `blur(${blur}px)`;
  m(t); ctx.restore();
}

// ---------- scene 1: hook (0-5) ----------
function sHook(t) {
  bgDots(t, .4);
  if (t < .9) {
    txt('>', CX - 34, CY, { size: 72, fam: MONO, weight: 700, color: C.acc, align: 'right' });
    if (Math.floor(t / .25) % 2 === 0) { ctx.fillStyle = C.acc; ctx.fillRect(CX - 14, CY - 38, 36, 76); }
    return;
  }
  if (t < 2.4) {
    const step = t < 1.9 ? .125 : .0625;
    const i = t < 1.9 ? Math.floor((t - .9) / step) : 8 + Math.floor((t - 1.9) / step);
    const lt = t - (t < 1.9 ? .9 + i * step : 1.9 + (i - 8) * step);
    const m = MOCKS[(i * 5) % MOCKS.length];
    const s = .9 + hash(i) * .3, w = 900 * s, h = w * 2 / 3;
    ctx.save();
    ctx.translate(CX + (hash(i + 3) - .5) * 120, CY + (hash(i + 7) - .5) * 260);
    ctx.rotate((hash(i + 1) - .5) * .12);
    drawMock(m, -w / 2, -h / 2, w, h, t);
    const price = ['$12/mo', '$15/mo', '$10/mo', '$8/mo', '$20/mo', '$99/yr'][i % 6];
    ctx.save(); ctx.translate(w / 2 - 90, -h / 2 + 10); ctx.rotate(.18);
    chip(price, 0, 0, { size: 34, bg: C.red, color: '#fff' }); ctx.restore();
    ctx.restore();
    ctx.fillStyle = `rgba(255,255,255,${.35 * Math.exp(-lt * 30)})`; ctx.fillRect(0, 0, W, H);
    return;
  }
  glow(CX, CY, 700, C.acc2, .25);
  const up = eOutExpo(p(t, 3.5, 3.8));
  slam('WHY USE IT?', CX, lerp(CY, 700, up), t, 2.4, { size: 150, weight: 900, maxW: 960, alpha: lerp(1, .35, up) });
  slam('WHEN I CAN', CX, 900, t, 3.6, { size: 120, weight: 900, maxW: 960 });
  slam('BUILD IT.', CX, 1070, t, 3.85, { size: 210, weight: 900, maxW: 980, color: C.acc, glow: 50 });
}

// ---------- scene 2: the challenge (5-12) ----------
function stamp(s, x, y, t, t0, rot) {
  const d = t - t0; if (d < 0) return;
  const k = eOutExpo(clamp(d / .16));
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot * Math.PI / 180); ctx.scale(lerp(3, 1, k), lerp(3, 1, k));
  ctx.globalAlpha *= clamp(d / .05);
  const w = tw(s, 70, 900, SANS, 8) + 56;
  ctx.shadowColor = C.acc; ctx.shadowBlur = 24 + 60 * Math.exp(-d * 5);
  rr(-w / 2, -54, w, 108, 14); ctx.lineWidth = 9; ctx.strokeStyle = C.acc; ctx.stroke();
  ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fill();
  txt(s, 4, 4, { size: 70, weight: 900, color: C.acc, ls: 8 });
  ctx.restore();
}
function sChallenge(t) {
  bgDots(t, .8); particles(t, .6); glow(CX, 900, 800, C.acc2, .22);
  const cards = [
    { m: mockVoice, label: 'VOICE TYPING', sub: 'wispr flow-style', x: 330, y: 560, r: -7, d: 0 },
    { m: mockLauncher, label: 'LAUNCHER', sub: 'raycast-style', x: 750, y: 930, r: 6, d: .25 },
    { m: mockWorkspace, label: 'WORKSPACE', sub: 'notion-style', x: 340, y: 1300, r: -4, d: .5 },
  ];
  const gather = eInOut(p(t, 9.1, 9.7));
  cards.forEach((c, i) => {
    const k = eOutExpo(p(t, 5 + c.d, 6 + c.d));
    const bob = Math.sin(t * 1.6 + i * 2) * 14 * (1 - gather);
    let x = c.x, y = c.y + bob + (1 - k) * 1500, r = c.r + (1 - k) * 30, s = 1;
    x = lerp(x, 200 + i * 340, gather); y = lerp(y, 520, gather); s = lerp(1, .52, gather); r = lerp(r, 0, gather);
    const yaw = Math.sin(t * .9 + i * 1.7) * .22 * (1 - gather);
    ctx.save();
    ctx.translate(x, y); ctx.rotate(r * Math.PI / 180);
    ctx.transform(Math.cos(yaw), Math.sin(yaw) * .15, 0, 1, 0, 0); ctx.scale(s, s);
    ctx.shadowColor = 'rgba(139,92,255,.45)'; ctx.shadowBlur = 80;
    drawMock(c.m, -270, -180, 540, 360, t);
    ctx.shadowBlur = 0;
    chip(c.label, -270, -186, { size: 28, align: 'left' });
    chip(c.sub, -270, 210, { size: 22, align: 'left', bg: '#16161d', color: C.dim, border: '#2a2a35' });
    stamp('REBUILD', 40, 20, t, 6.5 + i, -12);
    ctx.restore();
  });
  if (t >= 9.4) {
    txt('// the plan', CX, 790, { size: 30, fam: MONO, weight: 600, color: C.dim, alpha: p(t, 9.4, 9.7) });
    slam('POPULAR APPS', CX, 900, t, 9.6, { size: 120, weight: 900, maxW: 960 });
    const a = eOutExpo(p(t, 10.1, 10.5));
    if (a > 0) {
      ctx.save(); ctx.strokeStyle = C.acc; ctx.lineWidth = 8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(CX, 990); ctx.lineTo(CX, 990 + 110 * a); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(CX - 30, 1070 + 30 * a); ctx.lineTo(CX, 1100 * 1 + 0 * a); ctx.lineTo(CX + 30, 1070 + 30 * a);
      ctx.globalAlpha = a; ctx.stroke(); ctx.restore();
    }
    slam('MY OWN VERSIONS', CX, 1210, t, 10.6, { size: 120, weight: 900, maxW: 980, color: C.acc, glow: 40 });
  }
}

// ---------- scene 3: target Wispr Flow (12-22) ----------
const TYPED3 = 'Build me a voice-to-text app that types wherever my cursor is.';
// Echofy's push-to-talk hotkey. down: 0 (up) .. 1 (held).
function keycap(x, y, w, h, label, down) {
  const d = down * 12;
  if (down > 0) glow(x + w / 2, y + h / 2, w * 1.1, C.acc, .45 * down);
  rr(x, y + 14, w, h, 26); ctx.fillStyle = '#060608'; ctx.fill();
  rr(x, y + d, w, h, 26); ctx.fillStyle = down > .5 ? '#182008' : '#191920'; ctx.fill();
  ctx.strokeStyle = down > 0 ? C.acc : '#3a3a46'; ctx.lineWidth = 4; ctx.stroke();
  rr(x + 14, y + d + 12, w - 28, h - 34, 18); ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2; ctx.stroke();
  txt(label, x + w / 2, y + d + h / 2 - 6, { size: h * .2, fam: MONO, weight: 800, color: down > 0 ? C.acc : C.fg, ls: 2 });
}
const keyDown = (t, a, b) => clamp((t - a) / .08) * (1 - clamp((t - b) / .08));
function waveform(t, amp, y, n, x0, step, bw, maxH, flat = 0, col = C.acc) {
  for (let i = 0; i < n; i++) {
    const env = Math.sin((i + .5) / n * Math.PI);
    const h = lerp(6 + amp * maxH * env * (.3 + .7 * noise(i * .45 + t * 9)), 4, flat);
    ctx.fillStyle = i % 2 ? col : C.fg; ctx.globalAlpha = .9;
    rr(x0 + i * step, y - h / 2, bw, h, bw / 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
// Keystroke-injected text: appears a few characters at a time, like keyboard.write().
function typedText(s, t, t0, dur, x, y, size, maxW, lh) {
  const n = Math.floor(clamp((t - t0) / dur) * s.length);
  const lay = layoutWords(s.slice(0, n).split(' '), size, 700, SANS, maxW);
  lay.forEach(L => txt(L.w, x + L.x, y + L.line * lh, { size, weight: 700, align: 'left' }));
  const last = lay[lay.length - 1];
  if (t >= t0) caret(last ? x + last.x + last.ww : x, y + (last ? last.line * lh : 0), size * 1.1, t, C.fg);
}
function sTarget(t) {
  bgDots(t, .6);
  if (t < 13.6) {
    glow(CX, 860, 650, C.red, .18);
    const k = eOutExpo(p(t, 12, 12.5)), sz = lerp(900, 520, k);
    ctx.save(); ctx.strokeStyle = C.red; ctx.lineWidth = 6; const L = 70;
    for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      const x = CX + sx * sz / 2, y = 860 + sy * sz / 2;
      ctx.beginPath(); ctx.moveTo(x, y - sy * L); ctx.lineTo(x, y); ctx.lineTo(x - sx * L, y); ctx.stroke();
    }
    ctx.globalAlpha = .4; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(CX, 860 - sz / 2 - 60); ctx.lineTo(CX, 860 - sz / 2 + 40);
    ctx.moveTo(CX, 860 + sz / 2 - 40); ctx.lineTo(CX, 860 + sz / 2 + 60); ctx.stroke();
    ctx.restore();

        ctx.strokeStyle = '#33333f'; ctx.lineWidth = 2.5; rr(x, y, 300, 400, 22); ctx.stroke();
        txt('EP 0' + (n + 1), x + 24, y + 40, { size: 22, fam: MONO, weight: 700, color: C.dim, align: 'left' });
        txt('?', cx, cy + 10, { size: 200, weight: 900, glow: 30, glowColor: C.acc2 });
        txt('███████', cx, y + 340, { size: 26, fam: MONO, color: '#2c2c36' });
      } else {
        ctx.setLineDash([12, 10]); ctx.strokeStyle = '#2c2c36'; ctx.lineWidth = 2.5; rr(x, y, 300, 400, 22); ctx.stroke(); ctx.setLineDash([]);
        txt('EP 0' + (n + 1), x + 24, y + 40, { size: 22, fam: MONO, weight: 700, color: '#44444f', align: 'left' });
        txt('?', cx, cy, { size: 120, weight: 900, color: '#2c2c36' });
      }
      ctx.restore();
    }
    ctx.restore();
    ctx.save(); ctx.globalAlpha = 1 - out;
    slam('ONE APP.', CX, 1250, t, 49.0, { size: 110, weight: 900, maxW: 960 });
    slam('ONE CHALLENGE.', CX, 1365, t, 49.5, { size: 110, weight: 900, maxW: 960 });
    slam('UNLIMITED VIBES.', CX, 1500, t, 51.0, { size: 140, weight: 900, maxW: 980, color: C.acc, glow: 50 });
    ctx.restore();
    return;
  }
  // end card
  glow(CX, 820, 800, C.acc2, .3);
  const k = p(t, 53.5, 53.9);
  slam(TL.series.split(' ')[0], CX, 700, t, 53.5, { size: 250, weight: 900, maxW: 980 });
  slam(TL.series.split(' ')[1] || '', CX, 920, t, 53.65, { size: 250, weight: 900, maxW: 980, color: C.acc, stroke: 6, glow: 30 });
  txt(`${TL.episode} — ${TL.episodeTitle}`, CX, 1070, { size: 30, fam: MONO, weight: 600, color: C.dim, ls: 3, alpha: p(t, 54, 54.4), maxW: 940 });
  txt(TL.handle, CX, 1170, { size: 56, weight: 800, alpha: p(t, 54.3, 54.7) });
  const ck = eOutBack(p(t, 54.8, 55.2));
  if (ck > 0) {
    const pulse = 1 + kickEnv(t) * .035;
    ctx.save(); ctx.translate(CX, 1330); ctx.scale(ck * pulse, ck * pulse);
    const label = 'FOLLOW FOR THE NEXT BUILD', w = tw(label, 40, 900, SANS, 1) + 160;
    ctx.shadowColor = C.acc; ctx.shadowBlur = 40;
    rr(-w / 2, -50, w, 100, 50); ctx.fillStyle = C.acc; ctx.fill(); ctx.shadowBlur = 0;
    txt(label, -30, 2, { size: 40, weight: 900, color: '#000', ls: 1 });
    const nudge = 10 * kickEnv(t);
    txt('→', w / 2 - 62 + nudge, 0, { size: 50, weight: 900, color: '#000' });
    ctx.restore();
  }
}

// ---------- overlays ----------
function hud(t) {
  if (t < 5 || t >= 53.5 || (t >= 33.75 && t < 34)) return;
  const a = p(t, 5, 5.3);
  ctx.save(); ctx.globalAlpha = a;
  ctx.beginPath(); ctx.arc(76, 110, 9, 0, 7); ctx.fillStyle = C.acc; ctx.globalAlpha = a * (.5 + .5 * kickEnv(t) + .3); ctx.fill();
  ctx.globalAlpha = a;
  txt(TL.series, 98, 111, { size: 26, fam: MONO, weight: 800, align: 'left', ls: 5 });
  const s = Math.floor(t), tc = `${TL.episode} · 00:${String(s).padStart(2, '0')}`;
  txt(tc, W - 60, 111, { size: 24, fam: MONO, weight: 600, align: 'right', color: C.dim, ls: 2 });
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; const m = 36, L = 46;
  for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
    ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke();
  }
  ctx.restore();
}
function captions(t) {
  if (!SHOW_CAPTIONS) return;
  for (const c of TL.captions) {
    if (t < c.s || t > c.e + .15) continue;
    const words = c.text.split(' '), starts = wordStarts(c);
    const shown = starts.filter(s => s <= t).length;
    const alpha = 1 - p(t, c.e, c.e + .15);
    const lay = layoutWords(words, 52, 800, SANS, 900);
    const nLines = lay[lay.length - 1].line + 1;
    const lineW = []; lay.forEach(L => lineW[L.line] = L.x + L.ww);
    const lh = 70, y0 = 1690 - (nLines - 1) * lh / 2;
    ctx.save(); ctx.globalAlpha = alpha;
    const bw = Math.max(...lineW) + 60;
    rr(CX - bw / 2, y0 - 50, bw, nLines * lh + 30, 22); ctx.fillStyle = 'rgba(0,0,0,.62)'; ctx.fill();
    lay.forEach((L, i) => {
      if (i >= shown) return;
      const x = CX - lineW[L.line] / 2 + L.x, y = y0 + L.line * lh;
      const age = t - starts[i], pop = eOutBack(clamp(age / .14));
      const current = i === shown - 1 && t < starts[starts.length - 1] + .3;
      ctx.save(); ctx.translate(x + L.ww / 2, y); ctx.scale(lerp(.6, 1, pop), lerp(.6, 1, pop));
      txt(L.w, 0, 0, { size: 52, weight: 800, color: current ? C.acc : C.fg });
      ctx.restore();
    });
    ctx.restore();
  }
}
const buf = document.createElement('canvas'); buf.width = W; buf.height = H; const bctx = buf.getContext('2d');
const vig = document.createElement('canvas'); vig.width = W; vig.height = H;
(() => {
  const v = vig.getContext('2d'), g = v.createRadialGradient(CX, CY, H * .28, CX, CY, H * .72);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.7)');
  v.fillStyle = g; v.fillRect(0, 0, W, H);
  v.fillStyle = 'rgba(0,0,0,.14)'; for (let y = 0; y < H; y += 4) v.fillRect(0, y, W, 1);
})();
function post(t) {
  const g = Math.min(1, glitchAmt(t) + impactEnv(t) * .3);
  if (g > .05) {
    bctx.clearRect(0, 0, W, H); bctx.drawImage(cv, 0, 0);
    const seed = frameSeed(t), n = 5 + Math.floor(g * 12);
    for (let i = 0; i < n; i++) {
      const y = hash(seed * 13 + i) * H, h = 8 + hash(seed * 7 + i) * 140 * g, dx = (hash(seed * 3 + i) - .5) * 180 * g;
      ctx.drawImage(buf, 0, y, W, h, dx, y, W, h);
    }
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .45 * g;
    ctx.filter = 'hue-rotate(90deg)'; ctx.drawImage(buf, 16 * g, 0); ctx.restore();
  }
  for (const [ft, s] of [[34, 1], [51, .6], [12, .4]]) if (t >= ft && t < ft + .6) {
    ctx.fillStyle = `rgba(255,255,255,${s * Math.exp(-(t - ft) * 9)})`; ctx.fillRect(0, 0, W, H);
  }
  ctx.drawImage(vig, 0, 0);
  const fade = Math.max(1 - p(t, 0, .25), p(t, 59.2, 60));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

const SCENES = { hook: sHook, challenge: sChallenge, target: sTarget, montage: sMontage, reveal: sReveal, teaser: sTeaser };
window.renderFrame = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const z = 1 + kickEnv(t) * .012 + impactEnv(t) * .03, sh = impactEnv(t) * 16;
  ctx.save();
  ctx.translate(CX + (hash(frameSeed(t)) - .5) * sh, CY + (hash(frameSeed(t) + 5) - .5) * sh);
  ctx.scale(z, z); ctx.translate(-CX, -CY);
  const sc = TL.scenes.find(s => t >= s.start && t < s.end) || TL.scenes[TL.scenes.length - 1];
  SCENES[sc.name](t);
  ctx.restore();
  hud(t); captions(t); post(t);
};

if (!params.has('render')) {
  const fixed = params.get('t');
  if (fixed !== null) document.fonts.ready.then(() => renderFrame(parseFloat(fixed)));
  else { const t0 = performance.now(); const loop = () => { renderFrame(((performance.now() - t0) / 1000) % TL.duration); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
}
</script>
